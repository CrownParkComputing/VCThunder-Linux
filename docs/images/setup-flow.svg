<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="350" viewBox="0 0 1440 350" role="img" aria-labelledby="title desc">
<title id="title">Build, import, play</title><desc id="desc">Build the native Linux executable, import a supported CHD or complete game folder through first-run setup, then play or open in-game settings with F1.</desc>
<rect width="1440" height="350" rx="22" fill="#091725"/>
<g font-family="DejaVu Sans, sans-serif"><text x="44" y="57" fill="#ecf5ff" font-size="29" font-weight="700">First-time setup in three steps</text>
<g fill="#112638" stroke="#2d4b60"><rect x="44" y="85" width="428" height="220" rx="16"/><rect x="506" y="85" width="428" height="220" rx="16"/><rect x="968" y="85" width="428" height="220" rx="16"/></g>
<g font-size="20" font-weight="700"><circle cx="84" cy="130" r="22" fill="#174b4e"/><text x="77" y="137" fill="#76e9db">1</text><text x="123" y="138" fill="#ecf5ff">BUILD</text><circle cx="546" cy="130" r="22" fill="#174b4e"/><text x="539" y="137" fill="#76e9db">2</text><text x="585" y="138" fill="#ecf5ff">IMPORT YOUR GAME</text><circle cx="1008" cy="130" r="22" fill="#174b4e"/><text x="1001" y="137" fill="#76e9db">3</text><text x="1047" y="138" fill="#ecf5ff">PLAY</text></g>
<g font-size="19" fill="#b5cbdc"><text x="70" y="185">Install 32-bit SDL3 + Vulkan</text><text x="70" y="219">Compile the native Linux host</text><text x="532" y="185">Choose CHD, archive or folder</text><text x="532" y="219">Wait for “Ready to play”</text><text x="994" y="185">Insert coins, then press Start</text><text x="994" y="219">F1 opens settings and import</text></g>
<g font-family="DejaVu Sans Mono, monospace" font-size="18" fill="#78e5db"><text x="70" y="269">make linux -j4</text><text x="532" y="269">./build/vcthunder --menu</text><text x="994" y="269">F1 menu · F3 FPS</text></g></g></svg>